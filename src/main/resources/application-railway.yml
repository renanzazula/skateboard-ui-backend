server:
  # 8080 is skateboard-podcast-be, 8081 is Expo/Metro, 8082 is
  # skateboard-user-be, 8083 is skateboard-app-config-be, 8180 is Keycloak
  # (see skateboard-infrastructure/.docker/docker-compose.yaml) — pick a free
  # port.
  port: 8090

spring:
  application:
    name: ui-backend

  security:
    oauth2:
      resourceserver:
        jwt:
          # Same Keycloak realm skateboard-podcast-be uses — there is only one
          # realm today, and the FE's token (aud: skateboard-podcast-be) is
          # relayed unmodified to downstream services, which validate it
          # themselves. See infrastructure/security/SecurityConfig for why the
          # JWKS URI is built directly from this instead of relying on OIDC
          # discovery.
          issuer-uri: ${APP_SECURITY_OAUTH2_ISSUER_URI:http://localhost:8180/realms/skateboard-podcast}

  servlet:
    multipart:
      # This BFF proxies uploads to app-config-be and user-be, both of which
      # allow up to 5MB/6MB — keep these at least as high or uploads get
      # rejected here before ever reaching the downstream service.
      max-file-size: 5MB
      max-request-size: 6MB

clients:
  podcast:
    base-url: ${CLIENTS_PODCAST_BASE_URL:http://localhost:8080}
    connect-timeout-ms: ${CLIENTS_PODCAST_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CLIENTS_PODCAST_READ_TIMEOUT_MS:5000}
  user:
    base-url: ${CLIENTS_USER_BASE_URL:http://localhost:8082}
    connect-timeout-ms: ${CLIENTS_USER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CLIENTS_USER_READ_TIMEOUT_MS:5000}
  app-config:
    base-url: ${CLIENTS_APP_CONFIG_BASE_URL:http://localhost:8083}
    connect-timeout-ms: ${CLIENTS_APP_CONFIG_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CLIENTS_APP_CONFIG_READ_TIMEOUT_MS:5000}

app:
  cors:
    # Comma-separated list of origins allowed to call this BFF.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n"
