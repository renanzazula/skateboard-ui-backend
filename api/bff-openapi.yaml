        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Campaign deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Campaign is not DRAFT – archive it instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/publish:
    post:
      tags: [campaign]
      operationId: publishCampaign
      summary: Publish a campaign (admin)
      description: >-
        Enforces the publish invariants — 1–3 screens, total duration ≤ 10s,
        endAt after startAt, every screen valid. Invariant failures return 409.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_PUBLISH
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Campaign published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_PUBLISH required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Campaign does not satisfy the publish invariants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/pause:
    post:
      tags: [campaign]
      operationId: pauseCampaign
      summary: Pause a published campaign (admin)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_PUBLISH
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Campaign paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_PUBLISH required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Campaign is not in a state that can be paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/archive:
    post:
      tags: [campaign]
      operationId: archiveCampaign
      summary: Archive a campaign (admin)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_PUBLISH
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Campaign archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_PUBLISH required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/screens:
    post:
      tags: [campaign]
      operationId: addCampaignScreen
      summary: Add a screen to a campaign (admin)
      description: >-
        Appended after the last existing screen; upload its image separately
        afterward. Rejects past the V1 limit of 3 screens or 10s total duration.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignScreenRequest'
      responses:
        '201':
          description: Screen added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignScreenResponse'
        '400':
          description: Invalid input, or the screen/duration limit would be exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/screens/reorder:
    put:
      tags: [campaign]
      operationId: reorderCampaignScreens
      summary: Reorder a campaign's screens (admin)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCampaignScreensRequest'
      responses:
        '200':
          description: Screens reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: screenIds is not a full permutation of the campaign's screens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/screens/{screenId}:
    put:
      tags: [campaign]
      operationId: updateCampaignScreen
      summary: Update a screen's content and behavior (admin)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignScreenRequest'
      responses:
        '200':
          description: Screen updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignScreenResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign or screen not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [campaign]
      operationId: removeCampaignScreen
      summary: Remove a screen from a campaign (admin)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Screen removed
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign or screen not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/screens/{screenId}/image:
    post:
      tags: [campaign]
      operationId: uploadCampaignScreenImage
      summary: Upload/replace a screen's background image and focal point (admin)
      description: Stores the image as-is (no resizing/variants in V1).
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                focalPointX:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                focalPointY:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
      responses:
        '200':
          description: Screen image updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignScreenResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign or screen not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    PublicConfigResponse:
      type: object
      properties:
        loginBackgroundUrl:
          type: string
          nullable: true
        loginBackgroundVersion:
          type: integer
        loginBackgroundUpdatedAt:
          type: string
          format: date-time
          nullable: true
        appLogoUrl:
          type: string
          nullable: true
        appLogoVersion:
          type: integer
        appLogoUpdatedAt:
          type: string
          format: date-time
          nullable: true
        loginTitle:
          type: string
          nullable: true
        loginMessage:
          type: string
          nullable: true

    BrandingConfigResponse:
      type: object
      properties:
        loginBackgroundUrl:
          type: string
          nullable: true
        loginBackgroundVersion:
          type: integer
        loginBackgroundUpdatedAt:
          type: string
          format: date-time
          nullable: true
        appLogoUrl:
          type: string
          nullable: true
        appLogoVersion:
          type: integer
        appLogoUpdatedAt:
          type: string
          format: date-time
          nullable: true
        loginTitle:
          type: string
          nullable: true
        loginMessage:
          type: string
          nullable: true
        assets:
          type: array
          items:
            $ref: '#/components/schemas/BrandingAssetResponse'

    UpdateLoginTextRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    BrandingAssetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        contentType:
          type: string
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time

    SocialMediaLink:
      type: object
      required: [url]
      properties:
        platform:
          type: string
        url:
          type: string

    PostResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        publishAt:
          type: string
          format: date-time
        coverUrl:
          type: string
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Ordered array of typed content blocks
        socialMediaLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaLink'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        youtubeVideoId:
          type: string
          nullable: true
          description: Set only for posts ingested from the YouTube sync job.
        youtubeUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          description: Plain-text video description from YouTube; not present on manually-authored posts predating the sync.
        durationSeconds:
          type: integer
          nullable: true
        episodeNumber:
          type: integer
          nullable: true
        platforms:
          type: array
          description: Distribution-platform links for this episode (YouTube, Spotify, ...). May be empty for manually-authored posts.
          items:
            $ref: '#/components/schemas/PostPlatformResponse'

    PostPlatformResponse:
      type: object
      properties:
        platform:
          type: string
          enum: [YOUTUBE, SPOTIFY]
        externalUrl:
          type: string
          nullable: true

    FeedPageResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostResponse'
        total:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer

    CreatePostRequest:
      type: object
      required: [title, coverUrl, publishAt]
      properties:
        title:
          type: string
        coverUrl:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
          default: published
        publishAt:
          type: string
          format: date-time
          description: >
            When the episode was (or is to be) published — the feed is ordered
            by it. Required: an episode without a publish date has no defined
            place in the feed.
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        socialMediaLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaLink'

    UpdatePostRequest:
      type: object
      required: [title, coverUrl]
      properties:
        title:
          type: string
        coverUrl:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        publishAt:
          type: string
          format: date-time
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        socialMediaLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaLink'

    ImportPostsRequest:
      type: object
      required: [posts]
      properties:
        posts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ImportPostItem'

    ImportPostItem:
      type: object
      required: [title]
      properties:
        title:
          type: string
        coverUrl:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
          default: published
        publishAt:
          type: string
          format: date-time
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        socialMediaLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaLink'

    ImportResult:
      type: object
      properties:
        imported:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            type: string

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        coverUrl:
          type: string
          nullable: true
        default:
          type: boolean
        postCount:
          type: integer
          format: int64

    AdminCategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
          description: Effective display name (customName when set, else the YouTube title).
        youtubeName:
          type: string
          description: The playlist title as the sync last saw it.
        customName:
          type: string
          nullable: true
          description: Admin rename override; null when the YouTube title is used as-is.
        coverUrl:
          type: string
          nullable: true
        enabled:
          type: boolean
          description: False when the source playlist disappeared from YouTube.
        default:
          type: boolean
        displayOrder:
          type: integer
          nullable: true
          description: Admin-set position; null sorts after all positioned categories.
        postCount:
          type: integer
          format: int64

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: New display name; null or blank resets to the YouTube title.

    ReorderCategoriesRequest:
      type: object
      required: [categoryIds]
      properties:
        categoryIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    SyncResultResponse:
      type: object
      properties:
        received:
          type: integer
        created:
          type: integer
        existing:
          type: integer
        categoryChanges:
          type: integer
        success:
          type: boolean

    AccountStatus:
      type: string
      enum: [ACTIVE, DEACTIVATED, DELETED]

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        profilePictureUrl:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string

    NotificationPreferences:
      type: object
      properties:
        pushEnabled:
          type: boolean
        newPodcastEnabled:
          type: boolean

    RegisterDeviceRequest:
      type: object
      required: [platform, provider, pushToken]
      properties:
        platform:
          type: string
          enum: [IOS, ANDROID]
        provider:
          type: string
          enum: [EXPO]
          default: EXPO
        pushToken:
          type: string
          description: Provider-issued token, e.g. ExponentPushToken[xxxx]
        appVersion:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true

    DeviceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceIdentifier:
          type: string
        platform:
          type: string
          enum: [IOS, ANDROID]
        provider:
          type: string
          enum: [EXPO]
        appVersion:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        enabled:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      # pushToken is never returned: it is a delivery credential, and the
      # client already knows the value it just sent.

    NotificationPreferencesResponse:
      type: object
      properties:
        notifications:
          $ref: '#/components/schemas/NotificationPreferences'
        updatedAt:
          type: string
          format: date-time

    UpdateNotificationPreferencesRequest:
      type: object
      required: [notifications]
      properties:
        notifications:
          $ref: '#/components/schemas/NotificationPreferences'

    ChangeUsernameRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8

    ProblemReportCategory:
      type: string
      enum: [APP_ERROR, CONTENT_ISSUE, ACCOUNT_ISSUE, OTHER]

    ProblemReportPlatform:
      type: string
      enum: [ANDROID, IOS]

    ProblemReportRequest:
      type: object
      required: [category, message]
      properties:
        category:
          $ref: '#/components/schemas/ProblemReportCategory'
        message:
          type: string
          maxLength: 4000
        appVersion:
          type: string
        platform:
          $ref: '#/components/schemas/ProblemReportPlatform'

    ProblemReportResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/ProblemReportCategory'
        message:
          type: string
        appVersion:
          type: string
        platform:
          $ref: '#/components/schemas/ProblemReportPlatform'
        createdAt:
          type: string
          format: date-time

    HomeVideoCategoryConfigMode:
      type: string
      enum: [ALL, SELECTED]

    HomeVideoCategoryConfigResponse:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/HomeVideoCategoryConfigMode'
        enabledCategoryIds:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true

    HomeVideoCategoryConfigRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/HomeVideoCategoryConfigMode'
        enabledCategoryIds:
          type: array
          items:
            type: string

    FeaturedContentSource:
      type: string
      description: >-
        Logical content source owning the referenced contentId. Only PODCAST
        exists today; new sources are added here as they're onboarded.
      enum: [PODCAST]

    HomePlayerType:
      type: string
      enum: [MINI]

    HomePlayerPosition:
      type: string
      enum: [TOP, BOTTOM]

    PreferredPlaybackPlatform:
      type: string
      description: >-
        Which distribution platform to prefer when the featured content has
        more than one available (e.g. a podcast episode with both a Spotify
        and a YouTube link). Null/omitted means the resolver decides (today:
        prefer Spotify, fall back to YouTube). Still falls back to whichever
        platform is actually available if the preferred one isn't.
      enum: [SPOTIFY, YOUTUBE]

    HomeFeaturedPlayerConfigResponse:
      type: object
      properties:
        enabled:
          type: boolean
        contentSource:
          allOf:
            - $ref: '#/components/schemas/FeaturedContentSource'
          nullable: true
        contentId:
          type: string
          nullable: true
        playerType:
          $ref: '#/components/schemas/HomePlayerType'
        position:
          $ref: '#/components/schemas/HomePlayerPosition'
        preferredPlatform:
          allOf:
            - $ref: '#/components/schemas/PreferredPlaybackPlatform'
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    UpdateHomeFeaturedPlayerConfigRequest:
      type: object
      required: [enabled, playerType, position]
      properties:
        enabled:
          type: boolean
        contentSource:
          allOf:
            - $ref: '#/components/schemas/FeaturedContentSource'
          nullable: true
        contentId:
          type: string
          nullable: true
        playerType:
          $ref: '#/components/schemas/HomePlayerType'
        position:
          $ref: '#/components/schemas/HomePlayerPosition'
        preferredPlatform:
          allOf:
            - $ref: '#/components/schemas/PreferredPlaybackPlatform'
          nullable: true

    HomeFeaturedPlayerPlayback:
      type: object
      properties:
        type:
          type: string
          description: Playback adapter the mini player should use, e.g. SPOTIFY_EMBED or YOUTUBE.
        reference:
          type: string
          description: Provider-specific playback reference (e.g. the Spotify/YouTube URL) — opaque to the frontend beyond picking the adapter for `type`.

    HomeFeaturedPlayerResponse:
      type: object
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/FeaturedContentSource'
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true
        playback:
          $ref: '#/components/schemas/HomeFeaturedPlayerPlayback'
        position:
          $ref: '#/components/schemas/HomePlayerPosition'

    HomeVideoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Required for navigation — Video Details (/podcast/{slug}) has no by-id route.
        title:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
        thumbnailWidth:
          type: integer
          nullable: true
          description: >
            Intrinsic pixel width of thumbnailUrl, captured by podcast-be's
            YouTube sync. Lets the Home masonry gallery size a tile from its real
            aspect ratio without measuring the image first. Null on videos whose
            dimensions were never captured — clients must fall back to probing.
        thumbnailHeight:
          type: integer
          nullable: true
          description: Intrinsic pixel height of thumbnailUrl; see thumbnailWidth.
        youtubeVideoId:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          description: Category slug the video was fetched under (null in ALL mode).

    AboutPageStatus:
      type: string
      enum: [draft, published]

    AboutPageResponse:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AboutPageStatus'
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
          description: >-
            Ordered array of typed content blocks — same opaque shape as
            PostResponse.blocks. The frontend's shared/types/content-blocks.ts
            carries the concrete union (text, image, gallery, quote, video,
            embed, link, spotify, hero, social-links); a block may carry an
            optional `hidden: true`.
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          nullable: true

    UpdateAboutPageRequest:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AboutPageStatus'
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true

    AboutImageResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    ErrorResponse:
      # Matches exception/ErrorResponse, which is what this service actually
      # serialises. This previously declared {status, error}, which no response
      # has ever carried — so every client read undefined and fell back, and a
      # real error code could not be distinguished from a generic failure.
      # The HTTP status line carries the status; correlationId is what ties a
      # user-visible failure to the logs across services.
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. APP_CONFIG_SERVICE_UNAVAILABLE
        message:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

    # ── Campaign V1 (proxied from skateboard-app-config-be) ──────────────

    CampaignStatus:
      type: string
      description: >-
        The API-level lifecycle value. SCHEDULED/ACTIVE/EXPIRED are computed
        from startAt/endAt at read time, not stored or transitioned by a job —
        only DRAFT/PAUSED/ARCHIVED and the published intent are admin-driven.
      enum: [DRAFT, SCHEDULED, ACTIVE, PAUSED, EXPIRED, ARCHIVED]

    CampaignAudience:
      type: string
      enum: [ALL, AUTHENTICATED, ANONYMOUS]

    CampaignFrequencyType:
      type: string
      enum: [ALWAYS, ONCE, ONCE_PER_SESSION, ONCE_PER_DAY, MAX_PER_DAY]

    CampaignLayoutType:
      type: string
      description: V1 only has FULL_BACKGROUND; kept as its own enum for future layouts.
      enum: [FULL_BACKGROUND]

    CampaignTextAlignment:
      type: string
      enum: [LEFT, CENTER, RIGHT]

    CampaignTextSize:
      type: string
      enum: [SMALL, MEDIUM, LARGE, EXTRA_LARGE]

    CampaignActionType:
      type: string
      enum: [NONE, INTERNAL, EXTERNAL]

    CampaignEventType:
      type: string
      enum:
        - CAMPAIGN_STARTED
        - CAMPAIGN_SCREEN_IMPRESSION
        - CAMPAIGN_SCREEN_COMPLETED
        - CAMPAIGN_SCREEN_SKIPPED
        - CAMPAIGN_CTA_CLICKED
        - CAMPAIGN_CLOSED
        - CAMPAIGN_COMPLETED

    CampaignRequest:
      type: object
      required: [name, startAt, endAt, priority, audience, frequencyType]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
          description: Internal-only note; never shown to end users.
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        priority:
          type: integer
          description: Higher priority wins when multiple campaigns are eligible at once.
        audience:
          $ref: '#/components/schemas/CampaignAudience'
        frequencyType:
          $ref: '#/components/schemas/CampaignFrequencyType'
        maxDisplaysPerDay:
          type: integer
          nullable: true
          description: Required and only meaningful when frequencyType is MAX_PER_DAY.

    CampaignResponse:
      type: object
      required: [id, name, status, startAt, endAt, priority, audience, frequencyType, screens]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/CampaignStatus'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        priority:
          type: integer
        audience:
          $ref: '#/components/schemas/CampaignAudience'
        frequencyType:
          $ref: '#/components/schemas/CampaignFrequencyType'
        maxDisplaysPerDay:
          type: integer
          nullable: true
        screens:
          type: array
          items:
            $ref: '#/components/schemas/CampaignScreenResponse'
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true

    CampaignScreenRequest:
      type: object
      required: [durationSeconds, layoutType, textAlignment, titleSize, descriptionSize, closeEnabled, actionType]
      properties:
        durationSeconds:
          type: integer
        layoutType:
          $ref: '#/components/schemas/CampaignLayoutType'
        backgroundColor:
          type: string
          nullable: true
          description: Fallback color shown while/if the background image isn't loaded.
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        textAlignment:
          $ref: '#/components/schemas/CampaignTextAlignment'
        titleSize:
          $ref: '#/components/schemas/CampaignTextSize'
        descriptionSize:
          $ref: '#/components/schemas/CampaignTextSize'
        textColor:
          type: string
          nullable: true
        overlayOpacity:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
        closeEnabled:
          type: boolean
        closeAfterSeconds:
          type: integer
          nullable: true
          description: >-
            Must satisfy 0 <= closeAfterSeconds < durationSeconds when set;
            defaults to 1 second when closeEnabled is true and this is omitted.
        actionType:
          $ref: '#/components/schemas/CampaignActionType'
        actionLabel:
          type: string
          nullable: true
        actionTarget:
          type: string
          nullable: true
          description: >-
            A supported internal route (INTERNAL) or a validated external URL
            (EXTERNAL); required unless actionType is NONE.

    CampaignScreenResponse:
      type: object
      required: [id, position, durationSeconds, layoutType, textAlignment, titleSize, descriptionSize, closeEnabled, actionType]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        durationSeconds:
          type: integer
        layoutType:
          $ref: '#/components/schemas/CampaignLayoutType'
        backgroundUrl:
          type: string
          nullable: true
          description: Freshly presigned on every read; never persisted as-is.
        backgroundColor:
          type: string
          nullable: true
        focalPointX:
          type: number
          format: float
          nullable: true
        focalPointY:
          type: number
          format: float
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        textAlignment:
          $ref: '#/components/schemas/CampaignTextAlignment'
        titleSize:
          $ref: '#/components/schemas/CampaignTextSize'
        descriptionSize:
          $ref: '#/components/schemas/CampaignTextSize'
        textColor:
          type: string
          nullable: true
        overlayOpacity:
          type: number
          format: float
          nullable: true
        closeEnabled:
          type: boolean
        closeAfterSeconds:
          type: integer
          nullable: true
        actionType:
          $ref: '#/components/schemas/CampaignActionType'
        actionLabel:
          type: string
          nullable: true
        actionTarget:
          type: string
          nullable: true

    CampaignRuntimeResponse:
      type: object
      required: [id, priority, frequencyType, screens]
      description: >-
        The lean, display-only shape for GET /api/campaigns/active — no name,
        description, or audit fields; the client has no use for them.
      properties:
        id:
          type: string
          format: uuid
        priority:
          type: integer
        frequencyType:
          $ref: '#/components/schemas/CampaignFrequencyType'
        maxDisplaysPerDay:
          type: integer
          nullable: true
        screens:
          type: array
          items:
            $ref: '#/components/schemas/CampaignScreenResponse'

    ReorderCampaignScreensRequest:
      type: object
      required: [screenIds]
      properties:
        screenIds:
          type: array
          description: The campaign's screen ids in their new display order; must be a full permutation of its existing screens.
          items:
            type: string
            format: uuid

    CampaignEventRequest:
      type: object
      required: [eventType]
      properties:
        eventType:
          $ref: '#/components/schemas/CampaignEventType'
        screenId:
          type: string
          format: uuid
          nullable: true
          description: Omitted for campaign-level events (CAMPAIGN_STARTED/COMPLETED).
        platform:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        actionTarget:
          type: string
          nullable: true
          description: Only set for CAMPAIGN_CTA_CLICKED.
