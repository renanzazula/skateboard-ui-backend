# This is skateboard-ui-backend's OWN exposed contract — what the frontend
# actually calls, as implemented by the hand-written controllers
# (PodcastController, UserController). It is NOT wired into any
# openapi-generator-maven-plugin execution in pom.xml — those read
# api/openapi.yaml and api/user-openapi.yaml instead, which are vendored
# copies of skateboard-podcast-be's/skateboard-user-be's own specs, used only
# to generate this service's *outbound* WebClient clients. This file exists
# purely so external consumers (skateboard-fe's `api/bff-openapi.yaml`, see
# its DEVELOPMENT.md "Regenerating the API client" section) have an accurate
# spec to vendor and generate a typed client from.
#
# Keep this in sync by hand whenever a controller's routes/DTOs/
# @PreAuthorize authorities change — there is no codegen enforcing it.

openapi: "3.0.3"
info:
  title: Skateboard UI-backend API
  version: "1.0.0"

tags:
  - name: podcast
    description: Podcast endpoints
  - name: me
    description: Self-service operations for the currently authenticated user
  - name: config
    description: Public, pre-auth app configuration
  - name: branding
    description: Branding management endpoints (FUNC_TAB_SETTINGS_BRANDING)

paths:

  /api/podcast:
    get:
      tags: [podcast]
      operationId: getPodcastFeed
      summary: Get published podcast posts (paginated)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_PODCAST
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Podcast feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPageResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [podcast]
      operationId: createPodcastPost
      summary: Create a new podcast post (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_CREATE_POST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Podcast post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/podcast/{slug}:
    get:
      tags: [podcast]
      operationId: getPodcastPostBySlug
      summary: Get a single podcast post by slug
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_PODCAST
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Podcast post detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/podcast/{id}:
    put:
      tags: [podcast]
      operationId: updatePodcastPost
      summary: Update an existing podcast post (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_EDIT_POST
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Podcast post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [podcast]
      operationId: deletePodcastPost
      summary: Delete a podcast post (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_DELETE_POST
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Podcast post deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/podcast/import:
    post:
      tags: [podcast]
      operationId: importPodcastPosts
      summary: Bulk import podcast posts from JSON (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_IMPORT_JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPostsRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/podcast/sync:
    post:
      tags: [podcast]
      operationId: syncPodcastFromYoutube
      summary: Trigger the same YouTube sync the scheduler runs, on demand (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_IMPORT_JSON
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResultResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories:
    get:
      tags: [podcast]
      operationId: getCategories
      summary: List enabled categories (mirrors the channel's YouTube playlists)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_PODCAST
      responses:
        '200':
          description: Enabled categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{slug}/posts:
    get:
      tags: [podcast]
      operationId: getCategoryPosts
      summary: Get published posts for a category (paginated)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_PODCAST
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Category feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPageResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      tags: [me]
      operationId: getCurrentUser
      summary: Get the current authenticated user's profile
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_READ
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [me]
      operationId: updateCurrentUser
      summary: Update application-owned fields of the current user's profile
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [me]
      operationId: deleteCurrentUser
      summary: Delete the current user's account (coordinated domain + identity lifecycle operation)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_ACCOUNT_DELETE
      responses:
        '204':
          description: Account deleted (idempotent — also returned if already deleted)
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/preferences:
    get:
      tags: [me]
      operationId: getNotificationPreferences
      summary: Get the current user's notification preferences
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_READ
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [me]
      operationId: updateNotificationPreferences
      summary: Partially update the current user's notification preferences
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/profile-picture:
    post:
      tags: [me]
      operationId: uploadProfilePicture
      summary: Upload/replace the current user's profile picture
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_UPDATE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/username:
    post:
      tags: [me]
      operationId: changeUsername
      summary: Change the current user's username (coordinated with Keycloak)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid or already-taken username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/change-password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Change the current user's password (coordinated with Keycloak; passwords are never stored here)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_PASSWORD_CHANGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/deactivate:
    post:
      tags: [me]
      operationId: deactivateCurrentUser
      summary: Deactivate the current user's account
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_ACCOUNT_DEACTIVATE
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/problem-reports:
    post:
      tags: [me]
      operationId: reportProblem
      summary: Submit a problem report from the current user
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_PROBLEM_REPORT_CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemReportRequest'
      responses:
        '201':
          description: Problem report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemReportResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config:
    get:
      tags: [config]
      operationId: getPublicConfig
      summary: Get the public app configuration required to render the client (anonymous)
      responses:
        '200':
          description: Public app configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfigResponse'

  /api/config/branding:
    get:
      tags: [branding]
      operationId: getBrandingConfig
      summary: Load the complete branding configuration for the admin screen
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      responses:
        '200':
          description: Branding configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/branding/login-background:
    post:
      tags: [branding]
      operationId: uploadLoginBackground
      summary: Upload/replace the login background image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Login background updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [branding]
      operationId: removeLoginBackground
      summary: Remove the login background image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      responses:
        '200':
          description: Login background removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/branding/app-logo:
    post:
      tags: [branding]
      operationId: uploadAppLogo
      summary: Upload/replace the app logo image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: App logo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [branding]
      operationId: removeAppLogo
      summary: Remove the app logo image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      responses:
        '200':
          description: App logo removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/branding/assets:
    get:
      tags: [branding]
      operationId: listBrandingAssets
      summary: List branding assets (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      responses:
        '200':
          description: Branding assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrandingAssetResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [branding]
      operationId: uploadBrandingAsset
      summary: Upload a new named branding asset (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Branding asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingAssetResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An asset with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/branding/assets/{assetId}:
    put:
      tags: [branding]
      operationId: replaceBrandingAsset
      summary: Replace an existing branding asset's image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Branding asset replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingAssetResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
