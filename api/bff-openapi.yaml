# This is skateboard-ui-backend's OWN exposed contract — what the frontend
# actually calls, as implemented by the hand-written controllers
# (PodcastController, UserController). It is NOT wired into any
# openapi-generator-maven-plugin execution in pom.xml — those read
# api/openapi.yaml and api/user-openapi.yaml instead, which are vendored
# copies of skateboard-podcast-be's/skateboard-user-be's own specs, used only
# to generate this service's *outbound* WebClient clients. This file exists
# purely so external consumers (skateboard-fe's `api/bff-openapi.yaml`, see
# its DEVELOPMENT.md "Regenerating the API client" section) have an accurate
# spec to vendor and generate a typed client from.
#
# Keep this in sync by hand whenever a controller's routes/DTOs/
# @PreAuthorize authorities change — there is no codegen enforcing it.

openapi: "3.0.3"
info:
  title: Skateboard UI-backend API
  version: "1.0.0"

tags:
  - name: podcast
    description: Podcast endpoints
  - name: me
    description: Self-service operations for the currently authenticated user
  - name: config
    description: Public, pre-auth app configuration
  - name: branding
    description: Branding management endpoints (FUNC_TAB_SETTINGS_BRANDING)
  - name: home
    description: Home dashboard video feed (FUNC_TAB_HOME)
  - name: home-featured-player
    description: >-
      Home dashboard Featured Player (README-home-featured-mini-player.md).
      /api/config/home/featured-player manages the default configuration
      (FUNC_HOME_FEATURED_PLAYER_CONFIG); /api/home/featured-player is the
      resolved, UI-ready content for the Home screen (FUNC_TAB_HOME).
  - name: notifications
    description: >-
      Push device registration and notification preferences, served by
      skateboard-notification-be. /api/me/preferences kept its route, its
      shape and its FUNC_USER_SELF_* authorities when that service took the
      preferences over from skateboard-user-be, so this tag change is
      documentation, not a contract change for the app.
  - name: about-us
    description: >-
      About Us page (.docs/ABOUT_US_README.md). GET /api/about-us returns the
      published page to any authenticated user (FUNC_TAB_SETTINGS); the /admin
      read, PUT and image upload require FUNC_ABOUT_US_MANAGE. The page is a
      singleton — one draft, one published version — composed of an ordered
      array of typed content blocks, same opaque shape as PostResponse.blocks.
      Proxied straight through to skateboard-app-config-be.
  - name: campaign
    description: >-
      Startup Campaigns (.docs/README-campaign-v1-implementation-plan.md) —
      ordered full-screen sponsor/event/announcement sequences shown between
      the native splash and the app's normal destination. GET
      /api/campaigns/active and POST /api/campaigns/{id}/events are pre-auth
      (ANONYMOUS/ALL campaigns render before login); the frontend still relays
      its bearer on /active when signed in so AUTHENTICATED campaigns resolve.
      /api/campaigns/admin/** is the admin surface: FUNC_CAMPAIGN_READ for the
      reads, FUNC_CAMPAIGN_MANAGE for create/edit/screens, FUNC_CAMPAIGN_PUBLISH
      for publish/pause/archive. A campaign's status is admin-driven
      (DRAFT/PAUSED/ARCHIVED plus published intent); SCHEDULED/ACTIVE/EXPIRED
      are computed from startAt/endAt at read time. Screen images are stored
      as-is (no resizing/CDN in V1) and re-signed on every read. Proxied
      straight through to skateboard-app-config-be.

paths:

  /api/podcast:
    get:
      tags: [podcast]
      operationId: getPodcastFeed
      summary: Get published podcast posts (paginated)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_PODCAST
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
        - name: search
          in: query
          description: Case-insensitive title filter (used by the Home Featured Player episode picker)
          schema: { type: string }
      responses:
        '200':
          description: Podcast feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPageResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [podcast]
      operationId: createPodcastPost
      summary: Create a new podcast post (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_CREATE_POST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Podcast post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/podcast/{slug}:
    get:
      tags: [podcast]
      operationId: getPodcastPostBySlug
      summary: Get a single podcast post by slug
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_PODCAST
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Podcast post detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/podcast/{id}:
    put:
      tags: [podcast]
      operationId: updatePodcastPost
      summary: Update an existing podcast post (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_EDIT_POST
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Podcast post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [podcast]
      operationId: deletePodcastPost
      summary: Delete a podcast post (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_DELETE_POST
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Podcast post deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/podcast/import:
    post:
      tags: [podcast]
      operationId: importPodcastPosts
      summary: Bulk import podcast posts from JSON (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_IMPORT_JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPostsRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/podcast/sync:
    post:
      tags: [podcast]
      operationId: syncPodcastFromYoutube
      summary: Trigger the same YouTube sync the scheduler runs, on demand (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_IMPORT_JSON
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResultResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories:
    get:
      tags: [podcast]
      operationId: getCategories
      summary: List enabled categories (mirrors the channel's YouTube playlists)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_PODCAST
      responses:
        '200':
          description: Enabled categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{slug}/posts:
    get:
      tags: [podcast]
      operationId: getCategoryPosts
      summary: Get published posts for a category (paginated)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_PODCAST
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Category feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPageResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/categories:
    get:
      tags: [podcast]
      operationId: getAdminCategories
      summary: List every category, disabled ones included (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_MANAGE_CATEGORIES
      responses:
        '200':
          description: All categories in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategoryResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/categories/{id}:
    patch:
      tags: [podcast]
      operationId: updateCategory
      summary: Rename a category (admin only); null name resets to the YouTube title
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_MANAGE_CATEGORIES
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/categories/order:
    put:
      tags: [podcast]
      operationId: reorderCategories
      summary: Set the display order of all categories (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_MANAGE_CATEGORIES
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCategoriesRequest'
      responses:
        '200':
          description: Categories in their new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategoryResponse'
        '400':
          description: Unknown, duplicated, or missing category ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/categories/{id}/default:
    put:
      tags: [podcast]
      operationId: setDefaultCategory
      summary: Make this category the single default (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_PODCAST_MANAGE_CATEGORIES
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The new default category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      tags: [me]
      operationId: getCurrentUser
      summary: Get the current authenticated user's profile
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_READ
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [me]
      operationId: updateCurrentUser
      summary: Update application-owned fields of the current user's profile
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [me]
      operationId: deleteCurrentUser
      summary: Delete the current user's account (coordinated domain + identity lifecycle operation)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_ACCOUNT_DELETE
      responses:
        '204':
          description: Account deleted (idempotent — also returned if already deleted)
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: Get the current user's notification preferences
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_READ
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [notifications]
      operationId: updateNotificationPreferences
      summary: Partially update the current user's notification preferences
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/devices/{deviceIdentifier}:
    put:
      tags: [notifications]
      operationId: registerDevice
      summary: Register or update the caller's push device
      description: >-
        Idempotent per (user, deviceIdentifier). The user and tenant come from
        the JWT downstream and are never read from the request. The client
        should call this after a successful sign-in, on app start, and whenever
        the Expo push token changes.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_NOTIFICATION_DEVICE_MANAGE
      parameters:
        - name: deviceIdentifier
          in: path
          required: true
          description: Stable per-install identifier chosen by the client
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: Device registered or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Notification service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [notifications]
      operationId: removeDevice
      summary: Stop sending push to the caller's device
      description: >-
        Called on logout. Idempotent — removing an unknown or already-removed
        device still returns 204, so a sign-out is never blocked by it. The
        device is disabled rather than deleted, keeping its delivery history.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_NOTIFICATION_DEVICE_MANAGE
      parameters:
        - name: deviceIdentifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Device disabled
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/profile-picture:
    post:
      tags: [me]
      operationId: uploadProfilePicture
      summary: Upload/replace the current user's profile picture
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_UPDATE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/username:
    post:
      tags: [me]
      operationId: changeUsername
      summary: Change the current user's username (coordinated with Keycloak)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_SELF_UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid or already-taken username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/change-password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Change the current user's password (coordinated with Keycloak; passwords are never stored here)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_PASSWORD_CHANGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/deactivate:
    post:
      tags: [me]
      operationId: deactivateCurrentUser
      summary: Deactivate the current user's account
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_ACCOUNT_DEACTIVATE
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/problem-reports:
    post:
      tags: [me]
      operationId: reportProblem
      summary: Submit a problem report from the current user
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_USER_PROBLEM_REPORT_CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemReportRequest'
      responses:
        '201':
          description: Problem report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemReportResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/about-us:
    get:
      tags: [about-us]
      operationId: getAboutUs
      summary: Get the published About Us page (any authenticated user)
      description: >-
        Reached from the Settings tab, so it is gated by FUNC_TAB_SETTINGS — the
        baseline authority every standard user holds.
