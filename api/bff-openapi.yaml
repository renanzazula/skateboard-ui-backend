          description: Branding asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [branding]
      operationId: removeBrandingAsset
      summary: Remove a branding asset (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Branding asset removed
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Branding asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    PublicConfigResponse:
      type: object
      properties:
        loginBackgroundUrl:
          type: string
          nullable: true
        loginBackgroundVersion:
          type: integer
        loginBackgroundUpdatedAt:
          type: string
          format: date-time
          nullable: true
        appLogoUrl:
          type: string
          nullable: true
        appLogoVersion:
          type: integer
        appLogoUpdatedAt:
          type: string
          format: date-time
          nullable: true

    BrandingConfigResponse:
      type: object
      properties:
        loginBackgroundUrl:
          type: string
          nullable: true
        loginBackgroundVersion:
          type: integer
        loginBackgroundUpdatedAt:
          type: string
          format: date-time
          nullable: true
        appLogoUrl:
          type: string
          nullable: true
        appLogoVersion:
          type: integer
        appLogoUpdatedAt:
          type: string
          format: date-time
          nullable: true
        assets:
          type: array
          items:
            $ref: '#/components/schemas/BrandingAssetResponse'

    BrandingAssetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        contentType:
          type: string
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time

    SocialMediaLink:
      type: object
      required: [url]
      properties:
        platform:
          type: string
        url:
          type: string

    PostResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        publishAt:
          type: string
          format: date-time
        coverUrl:
          type: string
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Ordered array of typed content blocks
        socialMediaLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaLink'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        youtubeVideoId:
          type: string
          nullable: true
          description: Set only for posts ingested from the YouTube sync job.
        youtubeUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          description: Plain-text video description from YouTube; not present on manually-authored posts predating the sync.
        durationSeconds:
          type: integer
          nullable: true
        episodeNumber:
          type: integer
          nullable: true

    FeedPageResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostResponse'
        total:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer

    CreatePostRequest:
      type: object
      required: [title, coverUrl]
      properties:
        title:
          type: string
        coverUrl:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
          default: published
        publishAt:
          type: string
          format: date-time
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        socialMediaLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaLink'

    UpdatePostRequest:
      type: object
      required: [title, coverUrl]
      properties:
        title:
          type: string
        coverUrl:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
        publishAt:
          type: string
          format: date-time
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        socialMediaLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaLink'

    ImportPostsRequest:
      type: object
      required: [posts]
      properties:
        posts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ImportPostItem'

    ImportPostItem:
      type: object
      required: [title]
      properties:
        title:
          type: string
        coverUrl:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published]
          default: published
        publishAt:
          type: string
          format: date-time
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        socialMediaLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialMediaLink'

    ImportResult:
      type: object
      properties:
        imported:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            type: string

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        coverUrl:
          type: string
          nullable: true
        default:
          type: boolean
        postCount:
          type: integer
          format: int64

    SyncResultResponse:
      type: object
      properties:
        received:
          type: integer
        created:
          type: integer
        existing:
          type: integer
        categoryChanges:
          type: integer
        success:
          type: boolean

    AccountStatus:
      type: string
      enum: [ACTIVE, DEACTIVATED, DELETED]

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        profilePictureUrl:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string

    NotificationPreferences:
      type: object
      properties:
        pushEnabled:
          type: boolean
        newPodcastEnabled:
          type: boolean

    NotificationPreferencesResponse:
      type: object
      properties:
        notifications:
          $ref: '#/components/schemas/NotificationPreferences'
        updatedAt:
          type: string
          format: date-time

    UpdateNotificationPreferencesRequest:
      type: object
      required: [notifications]
      properties:
        notifications:
          $ref: '#/components/schemas/NotificationPreferences'

    ChangeUsernameRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8

    ProblemReportCategory:
      type: string
      enum: [APP_ERROR, CONTENT_ISSUE, ACCOUNT_ISSUE, OTHER]

    ProblemReportPlatform:
      type: string
      enum: [ANDROID, IOS]

    ProblemReportRequest:
      type: object
      required: [category, message]
      properties:
        category:
          $ref: '#/components/schemas/ProblemReportCategory'
        message:
          type: string
          maxLength: 4000
        appVersion:
          type: string
        platform:
          $ref: '#/components/schemas/ProblemReportPlatform'

    ProblemReportResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/ProblemReportCategory'
        message:
          type: string
        appVersion:
          type: string
        platform:
          $ref: '#/components/schemas/ProblemReportPlatform'
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
