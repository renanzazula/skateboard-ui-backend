      summary: Upload/replace the app logo image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: App logo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
