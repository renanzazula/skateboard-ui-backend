            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [home]
      operationId: updateHomeVideoCategoryConfig
      summary: Update which video categories are eligible for the Home dashboard (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_HOME_CATEGORY_CONFIG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeVideoCategoryConfigRequest'
      responses:
        '200':
          description: Home video-category configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeVideoCategoryConfigResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_HOME_CATEGORY_CONFIG required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/home/featured-player:
    get:
      tags: [home-featured-player]
      operationId: getHomeFeaturedPlayerConfig
      summary: Get the default Home Featured Player configuration (any authenticated user)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Home Featured Player configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeFeaturedPlayerConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [home-featured-player]
      operationId: updateHomeFeaturedPlayerConfig
      summary: Update the default Home Featured Player configuration (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_HOME_FEATURED_PLAYER_CONFIG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHomeFeaturedPlayerConfigRequest'
      responses:
        '200':
          description: Home Featured Player configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeFeaturedPlayerConfigResponse'
        '400':
          description: Invalid input (e.g. enabled=true without contentSource/contentId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_HOME_FEATURED_PLAYER_CONFIG required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/about-us:
    get:
      tags: [about-us]
      operationId: getAboutUs
      summary: Get the published About Us page (any authenticated user)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The published About Us page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPageResponse'
        '204':
          description: No About Us page has been published yet
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [about-us]
      operationId: updateAboutUs
      summary: Create or update the About Us page (admin only)
      description: >-
        Saves the single About Us page. status=published makes it visible on
        GET /api/about-us; status=draft keeps it admin-only. Any block image
        reference that is a signed URL for this service's bucket is normalized
        back to its bare object key before persisting.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_ABOUT_US_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAboutPageRequest'
      responses:
        '200':
          description: About Us page saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPageResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_ABOUT_US_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/about-us/admin:
    get:
      tags: [about-us]
      operationId: getAboutUsAdmin
      summary: Get the About Us page including unpublished draft content (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_ABOUT_US_MANAGE
      responses:
        '200':
          description: The current About Us page (draft or published)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPageResponse'
        '204':
          description: No About Us page has been created yet
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_ABOUT_US_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/about-us/images:
    post:
      tags: [about-us]
      operationId: uploadAboutUsImage
      summary: Upload an image for use in an About Us content block (admin only)
      description: >-
        Stores the image in object storage and returns a freshly signed URL so
        the editor can preview it immediately. The block that references it
        persists the bare object key (see PUT /api/about-us).
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_ABOUT_US_MANAGE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image stored; returns a signed URL to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutImageResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_ABOUT_US_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/active:
    get:
      tags: [campaign]
      operationId: getActiveCampaigns
      summary: >-
        Get campaigns currently eligible to display (anonymous). Already
        filtered by schedule/status/audience and sorted by priority — the
        client applies only its own local frequency-capping on top.
      responses:
        '200':
          description: Eligible campaigns, highest priority first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignRuntimeResponse'

  /api/campaigns/{campaignId}/events:
    post:
      tags: [campaign]
      operationId: recordCampaignEvent
      summary: >-
        Record a campaign analytics event (impression, completion, skip, CTA
        click, close). Anonymous — a signed-out session must still be able to
        report events for an ANONYMOUS/ALL campaign. Never blocks or fails the
        app; unknown campaign/screen ids are accepted and logged, not rejected.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignEventRequest'
      responses:
        '204':
          description: Event recorded
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin:
    get:
      tags: [campaign]
      operationId: listCampaigns
      summary: List all campaigns regardless of status (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_READ
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_READ required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [campaign]
      operationId: createCampaign
      summary: Create a new campaign as DRAFT (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}:
    get:
      tags: [campaign]
      operationId: getCampaign
      summary: Get a single campaign, including its screens (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_READ
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_READ required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
