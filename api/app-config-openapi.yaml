      tags: [campaign]
      operationId: updateCampaign
      summary: >-
        Update a campaign's general/audience/frequency/schedule fields (admin
        only). Does not touch its screens — see the screens sub-resource.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [campaign]
      operationId: deleteCampaign
      summary: >-
        Permanently delete a campaign (admin only). Only allowed while status
        is DRAFT — a campaign that was ever published must be archived instead,
        so analytics/audit history stays meaningful.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Campaign deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Campaign is not DRAFT; archive it instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/publish:
    post:
      tags: [campaign]
      operationId: publishCampaign
      summary: >-
        Publish a campaign immediately or on its configured schedule (admin
        with publish permission). Backend validates aggregate invariants
        (at least one screen, screen/duration limits, valid schedule) first.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_PUBLISH
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Campaign published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_PUBLISH required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Campaign fails a publish invariant (e.g. no screens)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/pause:
    post:
      tags: [campaign]
      operationId: pauseCampaign
      summary: Pause a published/scheduled campaign (admin with publish permission)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_PUBLISH
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Campaign paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_PUBLISH required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Campaign is not in a pausable state (e.g. already archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/archive:
    post:
      tags: [campaign]
      operationId: archiveCampaign
      summary: >-
        Archive a campaign (admin with publish permission). Terminal state —
        an archived campaign can no longer be published, paused, or edited.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_PUBLISH
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Campaign archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_PUBLISH required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/screens:
    post:
      tags: [campaign]
      operationId: addCampaignScreen
      summary: >-
        Add a screen to a campaign (admin only). Appended after the last
        existing screen; upload its image separately afterward. Rejects past
        the V1 limit of 3 screens or 10s total duration.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignScreenRequest'
      responses:
        '201':
          description: Screen added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignScreenResponse'
        '400':
          description: Invalid input, or the screen/duration limit would be exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/screens/reorder:
    put:
      tags: [campaign]
      operationId: reorderCampaignScreens
      summary: Reorder a campaign's screens (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCampaignScreensRequest'
      responses:
        '200':
          description: Screens reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          description: screenIds does not match the campaign's actual screens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/screens/{screenId}:
    put:
      tags: [campaign]
      operationId: updateCampaignScreen
      summary: Update a campaign screen's content/timing/CTA (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignScreenRequest'
      responses:
        '200':
          description: Screen updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignScreenResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign or screen not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [campaign]
      operationId: removeCampaignScreen
      summary: Remove a screen from a campaign (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Screen removed
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign or screen not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/campaigns/admin/{campaignId}/screens/{screenId}/image:
    post:
      tags: [campaign]
      operationId: uploadCampaignScreenImage
      summary: >-
        Upload/replace a screen's background image and focal point (admin
        only). Stores the image as-is (no resizing/variants in V1).
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_CAMPAIGN_MANAGE
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                focalPointX:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                focalPointY:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
      responses:
        '200':
          description: Screen image updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignScreenResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_CAMPAIGN_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Campaign or screen not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    PublicConfigResponse:
      type: object
      properties:
        loginBackgroundUrl:
          type: string
          nullable: true
        loginBackgroundVersion:
          type: integer
        loginBackgroundUpdatedAt:
          type: string
          format: date-time
          nullable: true
        appLogoUrl:
          type: string
          nullable: true
        appLogoVersion:
          type: integer
        appLogoUpdatedAt:
          type: string
          format: date-time
          nullable: true
        loginTitle:
          type: string
          nullable: true
        loginMessage:
          type: string
          nullable: true

    BrandingConfigResponse:
      type: object
      properties:
        loginBackgroundUrl:
          type: string
          nullable: true
        loginBackgroundVersion:
          type: integer
        loginBackgroundUpdatedAt:
          type: string
          format: date-time
          nullable: true
        appLogoUrl:
          type: string
          nullable: true
        appLogoVersion:
          type: integer
        appLogoUpdatedAt:
          type: string
          format: date-time
          nullable: true
        loginTitle:
          type: string
          nullable: true
        loginMessage:
          type: string
          nullable: true
        assets:
          type: array
          items:
            $ref: '#/components/schemas/BrandingAssetResponse'

    UpdateLoginTextRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    BrandingAssetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        contentType:
          type: string
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    AboutPageStatus:
      type: string
      enum: [draft, published]

    AboutPageResponse:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AboutPageStatus'
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
          description: >-
            Ordered array of typed content blocks. Opaque to this service —
            same treatment as a podcast post's blocks. Image references inside
            a block are bare object keys on read; the frontend's
            shared/types/content-blocks.ts carries the concrete union.
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          nullable: true

    UpdateAboutPageRequest:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AboutPageStatus'
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true

    AboutImageResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    HomeVideoCategoryConfigMode:
      type: string
      enum: [ALL, SELECTED]

    HomeVideoCategoryConfigResponse:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/HomeVideoCategoryConfigMode'
        enabledCategoryIds:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true

    HomeVideoCategoryConfigRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/HomeVideoCategoryConfigMode'
        enabledCategoryIds:
          type: array
          items:
            type: string

    FeaturedContentSource:
      type: string
      description: >-
        Logical content source owning the referenced contentId. Only PODCAST
        exists today; new sources are added here as they're onboarded.
      enum: [PODCAST]

    HomePlayerType:
      type: string
      enum: [MINI]

    HomePlayerPosition:
      type: string
      enum: [TOP, BOTTOM]

    PreferredPlaybackPlatform:
      type: string
      description: >-
        Which distribution platform to prefer when the featured content has
        more than one available (e.g. a podcast episode with both a Spotify
        and a YouTube link). Null/omitted means the resolver decides (today:
        prefer Spotify, fall back to YouTube). Still falls back to whichever
        platform is actually available if the preferred one isn't.
      enum: [SPOTIFY, YOUTUBE]

    HomeFeaturedPlayerConfigResponse:
      type: object
      properties:
        enabled:
          type: boolean
        contentSource:
          allOf:
            - $ref: '#/components/schemas/FeaturedContentSource'
          nullable: true
        contentId:
          type: string
          nullable: true
        playerType:
          $ref: '#/components/schemas/HomePlayerType'
        position:
          $ref: '#/components/schemas/HomePlayerPosition'
        preferredPlatform:
          allOf:
            - $ref: '#/components/schemas/PreferredPlaybackPlatform'
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    UpdateHomeFeaturedPlayerConfigRequest:
      type: object
      required: [enabled, playerType, position]
      properties:
        enabled:
          type: boolean
        contentSource:
          allOf:
            - $ref: '#/components/schemas/FeaturedContentSource'
          nullable: true
        contentId:
          type: string
          nullable: true
        playerType:
          $ref: '#/components/schemas/HomePlayerType'
        position:
          $ref: '#/components/schemas/HomePlayerPosition'
        preferredPlatform:
          allOf:
            - $ref: '#/components/schemas/PreferredPlaybackPlatform'
          nullable: true

    CampaignStatus:
      type: string
      description: >-
        The API-level lifecycle value (spec §4). SCHEDULED/ACTIVE/EXPIRED are
        computed from startAt/endAt at read time, not stored or transitioned
        by a job — only DRAFT/PAUSED/ARCHIVED and the published intent behind
        SCHEDULED/ACTIVE/EXPIRED are admin-driven and persisted.
      enum: [DRAFT, SCHEDULED, ACTIVE, PAUSED, EXPIRED, ARCHIVED]

    CampaignAudience:
      type: string
      enum: [ALL, AUTHENTICATED, ANONYMOUS]

    CampaignFrequencyType:
      type: string
      enum: [ALWAYS, ONCE, ONCE_PER_SESSION, ONCE_PER_DAY, MAX_PER_DAY]

    CampaignLayoutType:
      type: string
      description: >-
        V1 only has FULL_BACKGROUND; kept as its own enum (spec §7) so future
        layouts (IMAGE_TOP, CARD, VIDEO) don't require an API-breaking change.
      enum: [FULL_BACKGROUND]

    CampaignTextAlignment:
      type: string
      enum: [LEFT, CENTER, RIGHT]

    CampaignTextSize:
      type: string
      enum: [SMALL, MEDIUM, LARGE, EXTRA_LARGE]

    CampaignActionType:
      type: string
      enum: [NONE, INTERNAL, EXTERNAL]

    CampaignEventType:
      type: string
      enum:
        - CAMPAIGN_STARTED
        - CAMPAIGN_SCREEN_IMPRESSION
        - CAMPAIGN_SCREEN_COMPLETED
        - CAMPAIGN_SCREEN_SKIPPED
        - CAMPAIGN_CTA_CLICKED
        - CAMPAIGN_CLOSED
        - CAMPAIGN_COMPLETED

    CampaignRequest:
      type: object
      required: [name, startAt, endAt, priority, audience, frequencyType]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
          description: Internal-only note; never shown to end users.
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        priority:
          type: integer
          description: Higher priority wins when multiple campaigns are eligible at once.
        audience:
          $ref: '#/components/schemas/CampaignAudience'
        frequencyType:
          $ref: '#/components/schemas/CampaignFrequencyType'
        maxDisplaysPerDay:
          type: integer
          nullable: true
          description: Required and only meaningful when frequencyType is MAX_PER_DAY.

    CampaignResponse:
      type: object
      required: [id, name, status, startAt, endAt, priority, audience, frequencyType, screens]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/CampaignStatus'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        priority:
          type: integer
        audience:
          $ref: '#/components/schemas/CampaignAudience'
        frequencyType:
          $ref: '#/components/schemas/CampaignFrequencyType'
        maxDisplaysPerDay:
          type: integer
          nullable: true
        screens:
          type: array
          items:
            $ref: '#/components/schemas/CampaignScreenResponse'
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true

    CampaignScreenRequest:
      type: object
      required: [durationSeconds, layoutType, textAlignment, titleSize, descriptionSize, closeEnabled, actionType]
      properties:
        durationSeconds:
          type: integer
        layoutType:
          $ref: '#/components/schemas/CampaignLayoutType'
        backgroundColor:
          type: string
          nullable: true
          description: Fallback color shown while/if the background image isn't loaded.
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        textAlignment:
          $ref: '#/components/schemas/CampaignTextAlignment'
        titleSize:
          $ref: '#/components/schemas/CampaignTextSize'
        descriptionSize:
          $ref: '#/components/schemas/CampaignTextSize'
        textColor:
          type: string
          nullable: true
        overlayOpacity:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
        closeEnabled:
          type: boolean
        closeAfterSeconds:
          type: integer
          nullable: true
          description: >-
            Must satisfy 0 <= closeAfterSeconds < durationSeconds when set;
            defaults to 1 second when closeEnabled is true and this is omitted.
        actionType:
          $ref: '#/components/schemas/CampaignActionType'
        actionLabel:
          type: string
          nullable: true
        actionTarget:
          type: string
          nullable: true
          description: >-
            A supported internal route (INTERNAL) or a validated external URL
            (EXTERNAL); required unless actionType is NONE.

    CampaignScreenResponse:
      type: object
      required: [id, position, durationSeconds, layoutType, textAlignment, titleSize, descriptionSize, closeEnabled, actionType]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        durationSeconds:
          type: integer
        layoutType:
          $ref: '#/components/schemas/CampaignLayoutType'
        backgroundUrl:
          type: string
          nullable: true
          description: Freshly presigned on every read; never persisted as-is.
        backgroundColor:
          type: string
          nullable: true
        focalPointX:
          type: number
          format: float
          nullable: true
        focalPointY:
          type: number
          format: float
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        textAlignment:
          $ref: '#/components/schemas/CampaignTextAlignment'
        titleSize:
          $ref: '#/components/schemas/CampaignTextSize'
        descriptionSize:
          $ref: '#/components/schemas/CampaignTextSize'
        textColor:
          type: string
          nullable: true
        overlayOpacity:
          type: number
          format: float
          nullable: true
        closeEnabled:
          type: boolean
        closeAfterSeconds:
          type: integer
          nullable: true
        actionType:
          $ref: '#/components/schemas/CampaignActionType'
        actionLabel:
          type: string
          nullable: true
        actionTarget:
          type: string
          nullable: true

    CampaignRuntimeResponse:
      type: object
      required: [id, priority, frequencyType, screens]
      description: >-
        The lean, display-only shape for GET /api/campaigns/active — no name,
        description, or audit fields; the client has no use for them.
      properties:
        id:
          type: string
          format: uuid
        priority:
          type: integer
        frequencyType:
          $ref: '#/components/schemas/CampaignFrequencyType'
        maxDisplaysPerDay:
          type: integer
          nullable: true
        screens:
          type: array
          items:
            $ref: '#/components/schemas/CampaignScreenResponse'

    ReorderCampaignScreensRequest:
      type: object
      required: [screenIds]
      properties:
        screenIds:
          type: array
          description: The campaign's screen ids in their new display order; must be a full permutation of its existing screens.
          items:
            type: string
            format: uuid

    CampaignEventRequest:
      type: object
      required: [eventType]
      properties:
        eventType:
          $ref: '#/components/schemas/CampaignEventType'
        screenId:
          type: string
          format: uuid
          nullable: true
          description: Omitted for campaign-level events (CAMPAIGN_STARTED/COMPLETED).
        platform:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        actionTarget:
          type: string
          nullable: true
          description: Only set for CAMPAIGN_CTA_CLICKED.
