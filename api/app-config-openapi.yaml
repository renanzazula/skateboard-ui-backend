# Vendored copy of skateboard-app-config-be/api/openapi.yaml — this is the
# contract skateboard-app-config-be actually serves, not a spec this repo
# owns. There is no shared contract registry between the two repos yet, so
# when skateboard-app-config-be's spec changes, re-copy it here by hand (and
# update AppConfigController's @PreAuthorize authorities, which mirror this
# file's x-required-permissions).

openapi: "3.0.3"
info:
  title: Skateboard App Config Api
  version: "1.0.0"

tags:
  - name: public
    description: Anonymous, pre-auth configuration endpoints
  - name: admin
    description: Branding management endpoints (FUNC_TAB_SETTINGS_BRANDING)
  - name: home
    description: >-
      Home dashboard video-category configuration. Reading the effective
      configuration only requires authentication (any authenticated user,
      including the BFF acting on a user's behalf); updating it requires
      FUNC_HOME_CATEGORY_CONFIG.
  - name: home-featured-player
    description: >-
      Home dashboard Featured Player configuration (README-home-featured-mini-player.md).
      Reading the default configuration only requires authentication (any
      authenticated user, including the BFF acting on a user's behalf);
      updating it requires FUNC_HOME_FEATURED_PLAYER_CONFIG. This service
      persists only a contentSource + contentId reference — the referenced
      content itself is owned by the source service (e.g. skateboard-podcast-be).
  - name: about-us
    description: >-
      The About Us page — an admin-configurable, application-wide content page
      (story, mission, community, social links). Reading the published page
      only requires authentication (any authenticated user); reading the draft,
      saving, and uploading images require FUNC_ABOUT_US_MANAGE. The page is a
      singleton (one draft, one published version) composed of an ordered array
      of typed content blocks — stored opaquely, the same way skateboard-podcast-be
      stores a post's blocks. Block image references are stored as bare object
      keys and re-signed on every read.

paths:

  /api/config:
    get:
      tags: [public]
      operationId: getPublicConfig
      summary: Get the public app configuration required to render the client (anonymous)
      responses:
        '200':
          description: Public app configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfigResponse'

  /api/config/branding:
    get:
      tags: [admin]
      operationId: getBrandingConfig
      summary: Load the complete branding configuration for the admin screen
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      responses:
        '200':
          description: Branding configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/branding/login-text:
    put:
      tags: [admin]
      operationId: updateLoginText
      summary: Update the configurable login screen title and message (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLoginTextRequest'
      responses:
        '200':
          description: Login text updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/branding/login-background:
    post:
      tags: [admin]
      operationId: uploadLoginBackground
      summary: Upload/replace the login background image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Login background updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [admin]
      operationId: removeLoginBackground
      summary: Remove the login background image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      responses:
        '200':
          description: Login background removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/branding/app-logo:
    post:
      tags: [admin]
      operationId: uploadAppLogo
      summary: Upload/replace the app logo image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: App logo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [admin]
      operationId: removeAppLogo
      summary: Remove the app logo image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      responses:
        '200':
          description: App logo removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/branding/assets:
    get:
      tags: [admin]
      operationId: listBrandingAssets
      summary: List branding assets (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      responses:
        '200':
          description: Branding assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrandingAssetResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [admin]
      operationId: uploadBrandingAsset
      summary: Upload a new named branding asset (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Branding asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingAssetResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An asset with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/branding/assets/{assetId}:
    put:
      tags: [admin]
      operationId: replaceBrandingAsset
      summary: Replace an existing branding asset's image (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Branding asset replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingAssetResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Branding asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [admin]
      operationId: removeBrandingAsset
      summary: Remove a branding asset (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Branding asset removed
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Branding asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/home/video-categories:
    get:
      tags: [home]
      operationId: getHomeVideoCategoryConfig
      summary: Get the effective Home dashboard video-category configuration (any authenticated user)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Home video-category configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeVideoCategoryConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [home]
      operationId: updateHomeVideoCategoryConfig
      summary: Update which video categories are eligible for the Home dashboard (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_HOME_CATEGORY_CONFIG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeVideoCategoryConfigRequest'
      responses:
        '200':
          description: Home video-category configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeVideoCategoryConfigResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_HOME_CATEGORY_CONFIG required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/home/featured-player:
    get:
      tags: [home-featured-player]
      operationId: getHomeFeaturedPlayerConfig
      summary: Get the default Home Featured Player configuration (any authenticated user)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Home Featured Player configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeFeaturedPlayerConfigResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [home-featured-player]
      operationId: updateHomeFeaturedPlayerConfig
      summary: Update the default Home Featured Player configuration (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_HOME_FEATURED_PLAYER_CONFIG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHomeFeaturedPlayerConfigRequest'
      responses:
        '200':
          description: Home Featured Player configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeFeaturedPlayerConfigResponse'
        '400':
          description: Invalid input (e.g. enabled=true without contentSource/contentId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_HOME_FEATURED_PLAYER_CONFIG required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/about-us:
    get:
      tags: [about-us]
      operationId: getAboutUs
      summary: Get the published About Us page (any authenticated user)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The published About Us page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPageResponse'
        '204':
          description: No About Us page has been published yet
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [about-us]
      operationId: updateAboutUs
      summary: Create or update the About Us page (admin only)
      description: >-
        Saves the single About Us page. status=published makes it visible on
        GET /api/about-us; status=draft keeps it admin-only. Any block image
        reference that is a signed URL for this service's bucket is normalized
        back to its bare object key before persisting.
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_ABOUT_US_MANAGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAboutPageRequest'
      responses:
        '200':
          description: About Us page saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPageResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_ABOUT_US_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/about-us/admin:
    get:
      tags: [about-us]
      operationId: getAboutUsAdmin
      summary: Get the About Us page including unpublished draft content (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_ABOUT_US_MANAGE
      responses:
        '200':
          description: The current About Us page (draft or published)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutPageResponse'
        '204':
          description: No About Us page has been created yet
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_ABOUT_US_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/about-us/images:
    post:
      tags: [about-us]
      operationId: uploadAboutUsImage
      summary: Upload an image for use in an About Us content block (admin only)
      description: >-
        Stores the image in object storage and returns a freshly signed URL so
        the editor can preview it immediately. The block that references it
        persists the bare object key (see PUT /api/about-us).
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_ABOUT_US_MANAGE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image stored; returns a signed URL to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutImageResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_ABOUT_US_MANAGE required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    PublicConfigResponse:
      type: object
      properties:
        loginBackgroundUrl:
          type: string
          nullable: true
        loginBackgroundVersion:
          type: integer
        loginBackgroundUpdatedAt:
          type: string
          format: date-time
          nullable: true
        appLogoUrl:
          type: string
          nullable: true
        appLogoVersion:
          type: integer
        appLogoUpdatedAt:
          type: string
          format: date-time
          nullable: true
        loginTitle:
          type: string
          nullable: true
        loginMessage:
          type: string
          nullable: true

    BrandingConfigResponse:
      type: object
      properties:
        loginBackgroundUrl:
          type: string
          nullable: true
        loginBackgroundVersion:
          type: integer
        loginBackgroundUpdatedAt:
          type: string
          format: date-time
          nullable: true
        appLogoUrl:
          type: string
          nullable: true
        appLogoVersion:
          type: integer
        appLogoUpdatedAt:
          type: string
          format: date-time
          nullable: true
        loginTitle:
          type: string
          nullable: true
        loginMessage:
          type: string
          nullable: true
        assets:
          type: array
          items:
            $ref: '#/components/schemas/BrandingAssetResponse'

    UpdateLoginTextRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    BrandingAssetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        contentType:
          type: string
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    AboutPageStatus:
      type: string
      enum: [draft, published]

    AboutPageResponse:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AboutPageStatus'
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
          description: >-
            Ordered array of typed content blocks. Opaque to this service —
            same treatment as a podcast post's blocks. Image references inside
            a block are bare object keys on read; the frontend's
            shared/types/content-blocks.ts carries the concrete union.
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          nullable: true

    UpdateAboutPageRequest:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AboutPageStatus'
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true

    AboutImageResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    HomeVideoCategoryConfigMode:
      type: string
      enum: [ALL, SELECTED]

    HomeVideoCategoryConfigResponse:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/HomeVideoCategoryConfigMode'
        enabledCategoryIds:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true

    HomeVideoCategoryConfigRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/HomeVideoCategoryConfigMode'
        enabledCategoryIds:
          type: array
          items:
            type: string

    FeaturedContentSource:
      type: string
      description: >-
        Logical content source owning the referenced contentId. Only PODCAST
        exists today; new sources are added here as they're onboarded.
      enum: [PODCAST]

    HomePlayerType:
      type: string
      enum: [MINI]

    HomePlayerPosition:
      type: string
      enum: [TOP, BOTTOM]

    PreferredPlaybackPlatform:
      type: string
      description: >-
        Which distribution platform to prefer when the featured content has
        more than one available (e.g. a podcast episode with both a Spotify
        and a YouTube link). Null/omitted means the resolver decides (today:
        prefer Spotify, fall back to YouTube). Still falls back to whichever
        platform is actually available if the preferred one isn't.
      enum: [SPOTIFY, YOUTUBE]

    HomeFeaturedPlayerConfigResponse:
      type: object
      properties:
        enabled:
          type: boolean
        contentSource:
          allOf:
            - $ref: '#/components/schemas/FeaturedContentSource'
          nullable: true
        contentId:
          type: string
          nullable: true
        playerType:
          $ref: '#/components/schemas/HomePlayerType'
        position:
          $ref: '#/components/schemas/HomePlayerPosition'
        preferredPlatform:
          allOf:
            - $ref: '#/components/schemas/PreferredPlaybackPlatform'
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    UpdateHomeFeaturedPlayerConfigRequest:
      type: object
      required: [enabled, playerType, position]
      properties:
        enabled:
          type: boolean
        contentSource:
          allOf:
            - $ref: '#/components/schemas/FeaturedContentSource'
          nullable: true
        contentId:
          type: string
          nullable: true
        playerType:
          $ref: '#/components/schemas/HomePlayerType'
        position:
          $ref: '#/components/schemas/HomePlayerPosition'
        preferredPlatform:
          allOf:
            - $ref: '#/components/schemas/PreferredPlaybackPlatform'
          nullable: true
