      operationId: removeBrandingAsset
      summary: Remove a branding asset (admin only)
      security:
        - bearerAuth: []
      x-required-permissions:
        - FUNC_TAB_SETTINGS_BRANDING
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Branding asset removed
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden – FUNC_TAB_SETTINGS_BRANDING required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Branding asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config/home/video-categories:
